# 从当前代码构建，不依赖 Docker Hub 镜像是否已更新。
# 首次 / 日常更新：./deploy.sh --docker
# 已有 cloudflared 可指向 http://127.0.0.1:8080。

services:
  blog:
    image: chilin11/blog:local
    build:
      context: .
    container_name: blog
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-}
    ports:
      # 默认只监听本机，供 cloudflared / 反向代理访问。
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8080}:80"
