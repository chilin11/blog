# 博客容器。用法：
#   1. （可选）同目录下创建 .env，写入 SITE_URL=https://blog.example.com
#   2. docker compose up -d
#   3. 在服务器已有的 cloudflared 里把域名指向 http://localhost:8080
# 更新到最新版本：docker compose pull && docker compose up -d

services:
  blog:
    image: chilin11/blog:latest
    container_name: blog
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-}
    ports:
      # 只监听本机，供 cloudflared 访问，不直接暴露到公网。
      # 端口被占用时改左边的数字，例如 "127.0.0.1:8090:80"
      - "127.0.0.1:8080:80"
